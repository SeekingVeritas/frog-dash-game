<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frog Dash</title>
<style>
body{margin:0;background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff;overflow:hidden}
canvas{border:4px solid #0f3460;background:linear-gradient(#16213e,#0f3460);max-width:100vw;height:auto}
#ui{position:absolute;top:10px;left:20px;font-size:20px;z-index:10}
#score{font-weight:bold;color:#e94560}
button{margin-top:10px;padding:10px 20px;font-size:16px;background:#e94560;border:none;color:#fff;cursor:pointer;border-radius:6px}
</style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<div id="ui">Score: <span id="score">0</span><br><button id="restart" style="display:none">Restart</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),restartBtn=document.getElementById('restart');
let player,obstacles,score,speed,gameOver,frame,animTick;
function start(){
  player={x:180,y:220,vy:0,onGround:true,state:'run'};
  obstacles=[];score=0;speed=6;gameOver=false;frame=0;animTick=0;
  restartBtn.style.display='none';loop();
}
function drawFrog(x,y,state){
  ctx.save();
  ctx.translate(x,y);
  // Body
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.ellipse(0,-20,25,35,0,0,Math.PI*2);ctx.fill();
  // Belly
  ctx.fillStyle='#8bc34a';
  ctx.beginPath();ctx.ellipse(0,5,18,22,0,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-12,-35,10,0,Math.PI*2);ctx.arc(12,-35,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2196f3';
  ctx.beginPath();ctx.arc(-12,-35,5,0,Math.PI*2);ctx.arc(12,-35,5,0,Math.PI*2);ctx.fill();
  // Shorts
  ctx.fillStyle='#1565c0';
  ctx.fillRect(-20,10,40,25);
  // Boots
  ctx.fillStyle='#5d4037';
  ctx.fillRect(-22,35,18,15);ctx.fillRect(4,35,18,15);
  // Arms
  ctx.fillStyle='#4caf50';
  if(state==='jump'){
    ctx.fillRect(-40,-40,20,12);ctx.fillRect(20,-40,20,12);
  } else {
    const armSwing = Math.sin(animTick*0.3)*10;
    ctx.fillRect(-35,armSwing,18,10);ctx.fillRect(17,-armSwing,18,10);
  }
  ctx.restore();
}
function loop(){
  if(gameOver)return;frame++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#2d4059';ctx.fillRect(0,300,canvas.width,100);
  ctx.fillStyle='#3e5c76';ctx.fillRect(0,300,canvas.width,12);
  player.vy+=0.55;player.y+=player.vy;
  if(player.y>=220){player.y=220;player.vy=0;player.onGround=true;if(player.state!=='crouch')player.state='run'}
  animTick++;
  drawFrog(player.x, player.y, player.state);
  if(frame%80===0){
    const high=Math.random()>0.65;
    obstacles.push({x:canvas.width+10,y:high?170:250,w:high?28:40,h:high?35:50,type:high?'fly':'rock'});
  }
  obstacles.forEach(o=>{
    o.x-=speed;
    if(o.type==='rock'){ctx.fillStyle='#6b4c3b';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill()}
    else{ctx.fillStyle='#aaa';ctx.fillRect(o.x,o.y,o.w,o.h)}
    if(player.x+30>o.x&&player.x-30<o.x+o.w&&player.y+40>o.y&&player.y<o.y+o.h&&player.onGround){gameOver=true;restartBtn.style.display='block'}
  });
  obstacles=obstacles.filter(o=>o.x>-50);
  score++;scoreEl.textContent=Math.floor(score/8);
  if(score%400===0)speed=Math.min(speed+0.3,11);
  if(!gameOver)requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='ArrowUp')&&player&&player.onGround&&!gameOver){player.vy=-12.5;player.onGround=false;player.state='jump'}
  if(e.code==='ArrowDown'&&player&&!gameOver)player.state='crouch';
});
document.addEventListener('keyup',e=>{if(e.code==='ArrowDown'&&player)player.state='run'});
canvas.addEventListener('click',()=>{if(player&&player.onGround&&!gameOver){player.vy=-12.5;player.onGround=false;player.state='jump'}});
restartBtn.onclick=start;
start();
</script>
</body>
</html>
